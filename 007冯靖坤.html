<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竖向横向展开滑动门</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            list-style: none;
            text-decoration: none;
            box-sizing: border-box;
            font-family: "Microsoft Yahei";
        }
        body {
            background-color: #f4f4f4;
            padding: 50px;
        }
        /* 外层容器 */
        .menu-wrap {
            width: 180px;
        }
        /* 一级菜单 竖向排列 */
        .level1 > li {
            width: 180px;
            height: 50px;
            line-height: 50px;
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            position: relative;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .level1 > li > a {
            color: #fff;
            display: block;
        }
        /* 二级菜单容器：放在一级菜单右侧，初始宽度0，隐藏 */
        .level2 {
            position: absolute;
            left: 180px;
            top: 0;
            width: 0;
            height: 100%;
            overflow: hidden;
            background-color: #3498db;
            transition: width 0.3s ease;
            white-space: nowrap;
        }
        /* 二级li横向排列 */
        .level2 li {
            display: inline-block;
            width: 110px;
            height: 50px;
            line-height: 50px;
            text-align: center;
        }
        .level2 li a {
            color: #fff;
        }
        /* hover一级，二级横向展开 */
        .level1 > li:hover .level2 {
            width: 440px;
        }
        .level1 > li:hover {
            background-color: #1a2530;
        }
        .level2 li:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="menu-wrap">
        <ul class="level1">
            <li>
                <a href="#">首页</a>
                <ul class="level2">
                    <li><a href="#">校园快讯</a></li>
                    <li><a href="#">通知公告</a></li>
                    <li><a href="#">校历安排</a></li>
                </ul>
            </li>
            <li>
                <a href="#">学院设置</a>
                <ul class="level2">
                    <li><a href="#">文学院</a></li>
                    <li><a href="#">数统学院</a></li>
                    <li><a href="#">新媒体学院</a></li>
                </ul>
            </li>
            <li>
                <a href="#">师资队伍</a>
                <ul class="level2">
                    <li><a href="#">教授名录</a></li>
                    <li><a href="#">引进人才</a></li>
                    <li><a href="#">名师工作室</a></li>
                </ul>
            </li>
            <li>
                <a href="#">招生就业</a>
                <ul class="level2">
                    <li><a href="#">本科招生</a></li>
                    <li><a href="#">就业信息</a></li>
                    <li><a href="#">校企合作</a></li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
